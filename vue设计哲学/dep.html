<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const obj = { name: 'zhangsan' }
      defineReactive(obj, 'name')

      // 模拟一个订阅者
      Dep.target = {
        update() {
          console.log('属性更新了，新值为：', obj.name)
        }
      }

      console.log('初始值：', obj.name) // 触发 getter，收集依赖

      obj.name = 'lisi' // 触发 setter，通知更新
    })
    class Dep {
      constructor() {
        this.subs = [] // 订阅者
      }

      depend() { // 收集依赖
        if (Dep.target) {
          this.subs.push(Dep.target)
        }
      }

      notify() { // 更新
        this.subs.forEach(sub => sub.update())
      }
    }

    function defineReactive(obj, key) {
      const dep = new Dep()
      let value = obj[key]
      console.log('Dep', Dep)

      Object.defineProperty(obj, key, {
        get() {
          if (Dep.target) {
            dep.depend()
          }
          return value
        },

        set(newValue) {
          value = newValue
          dep.notify()
        }
      })
    }
  </script>
</body>
</html>
