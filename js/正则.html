<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习正则表达式</title>
</head>
<body>
  <script>
    // 语法
    // 构造函数方式
    // new RegExp(pattern, flags)
    // 字面量方式
    // const regexp = /pattern/
    /* 常见模式
       1. 任意字符 . (排除换行符，加/s修饰符后可以匹配换行符)
       2. ^ 匹配输入的开始位置
       3. $ 匹配输入的结束位置
       4. [abc] 字符集合，匹配方括号内的任意一个字符
       5. | 选择符，匹配左边或右边的表达式
       6. () 分组，匹配括号内的表达式，并捕获匹配的文本
    */

   /** 常见的正则表达式语法
    * 1. digit \d 匹配一个数字字符，等价于 [0-9]
    * 2. word \w 匹配一个单词字符（字母、数字或下划线），等价于 [a-zA-Z0-9_]
    * 3. space \s 匹配一个空白字符（空格、制表符、换行符等 考虑空格 空格也是一个字符）
    * 4. 量词
    *    * 匹配前面的子表达式零次或多次
    *   + 匹配前面的子表达式一次或多次
    *  ? 匹配前面的子表达式零次或一次
    *  {n} 匹配前面的子表达式恰好 n 次
    * {n,} 匹配前面的子表达式至少 n 次
    * {n,m} 匹配前面的子表达式至少 n 次，但不超过 m 次
   */

   /** 修饰符
    * global (g) 修饰符，表示全局搜索，匹配输入中的所有匹配项，而不是在找到第一个匹配项后停止
    * ignoreCase (i) 修饰符，表示忽略大小写进行匹配
    * multiline (m) 修饰符，表示多行匹配，改变 ^ 和 $ 的行为，
    * 使它们分别匹配行的开始和结束，而不是整个输入的开始和结束。
    * **/

    /** str.replace(regexp, replacement)
     * replacement 可以是一个字符串，也可以是一个函数
     * $ 在 replacement 中用于引用匹配的内容、分组或插入特殊字符。
     * $ 特殊用法
     * $& 匹配到的子字符串 str.replace(/(\d+)/g, '数字：$&')
     * $` 匹配到的子字符串左边的文本 str.replace(/(\d+)/g, '左边：$`')
     * $$ 匹配 $ 字符 str.replace(/\$/g, '$$')
     * **/

     /**
      * 锚点
      * ^ 匹配输入的开始位置 startWith
      * $ 匹配输入的结束位置 endWith
      * let goodInput = "12:34"
      * let regexp = /^\d\d:\d\d$/
      * console.log(regexp.test(goodInput)) // true
      * 
      * 多行模式 "m"
      * let str = `
      *   1st line
      *   2nd line
      *   3rd line 4`
      *   let regexp = /^\d/gm
      * console.log(regexp.match(str)) // 1, 2, 3, 4
      * /\d\n/g 也可以，但是不会匹配到 4。因为4后面没有换行符。
     */

     /**
      * 词边界 \b 匹配一个单词边界，即一个单词字符和一个非单词字符之间的位置
      * alert( "Hello, Java!".match(/\bHello\b/) ); // Hello
      * alert( "Hello, Java!".match(/\bJava\b/) );  // Java
      * alert( "Hello, Java!".match(/\bHell\b/) );  // null（无匹配项）
      * alert( "Hello, Java!".match(/\bJava!\b/) ); // null（无匹配项）
      * alert( "1 23 456 78".match(/\b\d\d\b/g) ); // 23,78
      * alert( "12,34,56".match(/\b\d\d\b/g) ); // 12,34,56
     */

     /**
      * 转义字符 \ 转义特殊字符，使它们失去特殊含义
      * 假如想找到一个 . 号， 需要使用 \. 来转义
      * 例如：/\.js$/ 匹配以 .js 结尾的字符串
      * 一个斜杠 /\// 匹配一个斜杠字符
      * 也可以使用new RegExp()构造函数来创建正则表达式
      * new RegExp('/')
     */

     /**
      * 量词
      * <span>或<p> /<[a-z]+>/i
      * <h1> /<[a-z][a-z0-9]*>/i
      * <h1></h1> /<\/?[a-z][a-z0-9]*>/ig
      * 省略号 连续 3（或更多）个点。
      * /\.{3,}/g
      * HTML 颜色值 #ABCDEF 首字符是#,后面跟着6位十六进制字符
      * /^#[0-9a-f]{6}\b/gi
     */

     /**
      * 贪婪量词 和 惰性量词 在可重复时的区别
      * 贪婪量词：匹配尽可能多的字符，然后再回溯
      * 惰性量词：匹配尽可能少的字符
      * +? 在量词后添加 ? 号，即可实现惰性匹配
      * "123 456" /\d \d+?/ 123 4
      * <a href="test.com" link="doc">
      * /<a href=".*" link="doc">/g 有效
      * <a href="test.com" link="doc"><a href="test.com" link="doc">
      * /<a href=".*?" link="doc">/g
      * /<a href="[^"]*?" link="doc">/g
      * 
     */

     /**
      * 分组 ()
      * 像数组那样通过索引取分组的内容
      * 命名组 ?<name>
      * /(?<year>[0-9]{4})-(?<month>[0-9]{2})-(?<day>[0-9]{2})/
      * 替换组 $1 $2 $3 $<name>
      * 排除组 (?:...) 不捕获匹配内容
     */

     /**
      * 反向引用 \N \1 \2 \3
      * 按命名 反向引用 \k<name>
      * 应用场景： '" 成对匹配
      * 标签，嵌套标签
     */

     /**
      * 字符串 Java JavaScript PHP C++ C 中包含的编程语言：
      * /Java(Script)? | PHP C(\+\+)?/gi
      * 
     */

    /**
     * 断言 前瞻断言 x(?=y) “仅在后面是 Y 时匹配 X” 
     * X(?=Y)(?=Z) 匹配 X 后面跟着 Y 且后面跟着 Z 的情况
     * 否定的前瞻断言 X(?!Y) 匹配 X 后面`不`跟着 Y 的情况
     * 
     * - 后瞻断言 肯定 (?<=Y)X  “仅在前面是 Y 时匹配 X”
     * - 否定 (?<!Y)X  “仅在前面不是 Y 时匹配 X”
    */

    /**
     * 粘性修饰符y，在位置处开始搜索
    */
  </script>
</body>
</html>
